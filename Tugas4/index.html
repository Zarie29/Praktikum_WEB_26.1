<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    
    </header>

    <main>

        <!-- STATISTIK -->
        <section class="statistik">
            <div class="kartu">
                <h3>Total Mahasiswa</h3>
                <p id="totalMhs">0</p>
            </div>
            <div class="kartu">
                <h3>Rata-rata Nilai</h3>
                <p id="rataNilai">0</p>
            </div>
            <div class="kartu">
                <h3>Nilai Tertinggi</h3>
                <p id="nilaiTertinggi">0</p>
            </div>
        </section>

        <!-- FORM INPUT -->
        <section class="box">
            <h2 id="judulForm">Tambah Data Mahasiswa</h2>
            <form id="formMhs">
                <div class="baris">
                    <label for="inputNama">Nama</label>
                    <input type="text" id="inputNama" placeholder="Contoh: Andi">
                </div>
                <div class="baris">
                    <label for="inputNim">NIM</label>
                    <input type="text" id="inputNim" placeholder="Contoh: 23001">
                </div>
                <div class="baris">
                    <label for="inputJurusan">Jurusan</label>
                    <select id="inputJurusan">
                        <option value="">-- Pilih Jurusan --</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknik Komputer">Teknik Komputer</option>
                    </select>
                </div>
                <div class="baris">
                    <label for="inputNilai">Nilai (0-100)</label>
                    <input type="number" id="inputNilai" placeholder="Contoh: 85">
                </div>

                <p id="pesanError"></p>

                <button type="submit" id="btnSimpan">Tambah</button>
                <button type="button" id="btnBatal" class="sembunyi">Batal</button>
            </form>
        </section>

        <!-- TABEL DATA -->
        <section class="box">
            <h2>Daftar Mahasiswa</h2>

            <div class="alat">
                <input type="text" id="inputCari" placeholder="Cari nama atau NIM...">
                <select id="filterJurusan">
                    <option value="semua">Semua Jurusan</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknik Komputer">Teknik Komputer</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Jurusan</th>
                        <th>Nilai</th>
                        <th>Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <!-- isi tabel dibuat lewat JavaScript DOM -->
                </tbody>
            </table>

            <p id="pesanKosong" class="sembunyi">Data tidak ditemukan.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Dibuat dengan HTML, CSS, dan JavaScript DOM</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
