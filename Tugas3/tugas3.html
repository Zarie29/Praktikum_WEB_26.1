                <form>
                    <label for="nama">Nama</label>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email">

                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" rows="5" placeholder="Tulis pesan Anda"></textarea>
